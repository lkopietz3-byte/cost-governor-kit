name: Verify library

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only obsolete runs for the same event and PR/ref may cancel each other.
  # Each explicitly requested manual run has its own group.
  group: cost-governor-${{ github.workflow }}-${{ github.repository }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Library tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up the verified runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.3.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Audit all locked dependencies
        run: npm run audit:dependencies
      - name: Lint source and verifier
        run: npm run lint
      - name: Typecheck source and tests
        run: npm run typecheck
      - name: Run all library tests
        run: npm test -- --maxWorkers=1 --minWorkers=1
      - name: Build package exports
        run: npm run build
      - name: Verify the actual installable package
        run: npm run verify:package
